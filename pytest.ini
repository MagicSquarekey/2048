# -*- coding: utf-8 -*-
# pytest 配置文件
# 1) test_full_flow.py 是独立运行脚本（模块级顺序执行 + sys.exit），
#    不适合被 pytest 导入收集，需在收集前排除（见 tests/conftest.py）。
# 2) 关闭 pytest-asyncio：本项目为同步 pygame 测试，
#    该插件会在 Package 收集阶段抛 AttributeError 导致全量收集崩溃。
# 3) 测试数据目录隔离到临时目录（见 tests/conftest.py）。

[pytest]
addopts = -p no:asyncio
norecursedirs = dist build private .git
filterwarnings =
    ignore::DeprecationWarning
